[project]
name = "opspilot"
version = "2.0.1"
description = "Agentic RAG for incident PDFs with a Gradio UI. Every answer cites the file and page it came from."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI's File()/Depends() defaults

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
filterwarnings = ["ignore::DeprecationWarning"]
